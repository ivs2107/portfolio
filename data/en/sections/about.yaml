# a summary about you
summary: 'I have started becoming a software engineer because of 3D, and now I have 3 years of working experience with 3D.
          You may ask me why the domain of 3D attracts me, and the answer is simple: the complexity of having proper code
          that runs in real time is what excites me. You not only have a problem to solve, but you also need to make it as simple as possible so it can run
          in real time, and all these "tricks" to make it run faster are really interesting.

          Recently, I started working with a motion system and discovered the world of 3D animation, in which I am currently working at my job.
          Sometimes, I develop games in Unreal and Unity and participate in game jams. In my free time, I like to play card games.'

